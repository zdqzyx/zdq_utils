[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zdq_utils"
version = "0.1.0"
description = "Personal Python utility functions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "loguru",
    "pandas",
    "tushare",
]

[tool.setuptools.packages.find]
where = ["src"]
